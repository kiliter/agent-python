# #Created By AiCoding(codex) 智能申告报告填写平台（全智能体 + 全文件管理）Python 后端
[project]
name = "report-agent"
version = "0.1.0"
description = "基于 Pydantic AI 的智能申告报告填写智能体，资源以文件形式存放在 PVC 上"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic-ai-slim[openai]==2.67.0",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
report-agent = "report_agent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
