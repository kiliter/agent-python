# #Created By AiCoding(codex)
id: 107
name: 充值错号处理类
description: 客户在充值缴费时输错手机号码，将话费误充入他人号码并引发退费或核查诉求，需查询被充错目标号码在指定账期/日期内的真实充值流水。
skills:
- qry-balance
inputs:
- key: 手机号码
  required: false
  description: 客户手机号，11 位
  sample: '13900001234'
- key: 申诉内容
  required: false
  description: 客户申诉或投诉的原始诉求正文，辅助判断争议场景与核查重点
  sample: 用户反映未经本人允许开通业务，要求核查办理依据并处理。
- key: 充值号码
  required: false
  description: 充值的手机号码，11 位
  sample: '13900001234'
- key: 充值时间
  required: false
  description: 充值时间：支持 yyyyMMdd、yyyyMM（整月）或日期/账期范围（如 yyyyMMdd-yyyyMMdd）
  sample: '20260705'
- key: extraInfo
  required: false
  description: 上游附加信息（JSON 文本），可能包含充值号码、办理日期、手机号、安装地址等
  sample: '{"充值号码":"13900001234","办理日期":"20260705"}'
fields:
- name: 充值流水
  type: list
  columns:
  - name: 充值时间
    description: 充值时间（格式见 Skill qry-balance）
  - name: 支付方式
    description: 支付方式/充值渠道
  - name: 充值金额
    description: 充值金额（元，格式见 Skill qry-balance）
  - name: 流水号
    description: 充值订单号/流水号
  evidence: quote
  whenMissing: empty
  description: 按 Skill qry-balance 查询充值号码/手机号码在充值时间所属账期的余额流水，每条充值记录一行，单元格原样取自接口记录， evidence 引用每一行对应的接口记录；各账期接口调用成功但匹配 0 条流水时，必须提交 status="found"、value=[] 并附上结果为 0 行的 query_result 或 count=0 的 call_api 工具 callId 证据（严禁引用 load_skill）；仅在缺少必要入参或任一账期接口报错时提交 not_found。
- name: 客户号码
  evidence: derive
  description: 优先取入参「extraInfo」中的充值号码（或入参「充值号码」），其次从单据中摘取充值的 11 位客户号码，都没有时取入参「手机号码」（优先级与同族充值争议模板一致）。
