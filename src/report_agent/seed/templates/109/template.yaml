# #Created By AiCoding(codex)
id: 109
name: 合约协议争议类
description: 客户对所签署合约协议本身的条款内容（活动期限、优惠规则、客户承诺/违约责任条款等）存在异议或要求核实协议详情，暂不涉及提前解约赔付违约金计算或到期提醒。
skills:
- accept-type
- business-sms
- second-confirmation-sms
- verification-sms
inputs:
- key: 手机号码
  required: false
  description: 客户手机号，11 位
  sample: '13900001234'
- key: 业务名称
  required: false
  description: 本次争议的业务、套餐或活动名称
  sample: 5G智享套餐（个人版）
- key: 创建时间
  required: false
  description: 工单创建时间 yyyyMMddHHmmss，短信类 Skill 以它为查询基准
  sample: '20261105103012'
- key: 业务月份
  required: false
  description: 业务办理日期 yyyyMMdd；受理渠道为热线、掌上营业厅时用作受理日期
  sample: '20261105'
fields:
- name: 受理日期
  evidence: derive
  description: 受理渠道（字段「受理渠道」）为“热线”或“掌上营业厅”时，必须取入参「业务月份」（yyyyMMdd），用 format_date 转为“yyyy年M月d号”（如 20261005 → 2026年10月5号），value 直接使用工具输出并引用其 callId；业务月份缺失或不是合法的 8 位日期时提交 not_found。其他受理渠道只能从属于本次业务的单据（单据经清洗后包含入参「业务名称」）中摘取受理日期，保持单据原样，单据不属于本次业务或没有受理日期时提交 not_found。任何情况下都不得使用短信发送时间、创建时间或其他日期代替。
- name: 受理方式
  evidence: derive
  description: 单据（属于本次业务的单据）中有受理网点/营业厅名称时，填该受理网点（引用单据原文片段 type="document"）；没有受理网点且字段「受理渠道」为 found 时，填字段「受理渠道」的值（引用 {"type":"field","name":"受理渠道"}）；若既无单据受理网点且「受理渠道」为 not_found，则提交 not_found。
- name: 鉴权方式
  evidence: quote
  description: 从属于本次业务的单据中摘取客户身份鉴权方式（如“服务密码”“短信验证码”“身份证”），逐字引用。
- name: 商品名称
  evidence: input
  description: 等于入参「业务名称」。
- name: 活动时间
  evidence: derive
  description: 从属于本次业务的单据中，取业务名称对应的活动时间（不要取活动生效时间）；没有活动时间时，取业务名称对应的“生效时间”和“失效时间”：两者均有时按“生效时间到失效时间”拼接，只有一个时取该值；不得跨业务记录拼接（evidence 引用单据原文片段 type="document"）。无有效单据或单据中找不到时，回退从字段「订购短信」对应的短信正文中提取本次业务的活动时间或起止有效期（evidence 引用该短信记录 {"type":"api","resultId":...,"row":...,"column":"smsContent"}）；都没有时提交 not_found。
- name: 活动内容
  evidence: quote
  description: 从属于本次业务的单据中取业务名称对应的活动内容，有多条时取与业务名称匹配的一条（引用 type="document"）；单据中找不到时从字段「订购短信」对应的短信中摘取活动内容（引用 type="api"）。逐字引用。
- name: 客户承诺
  evidence: quote
  description: 从属于本次业务的单据中取业务名称对应的客户承诺，有多条时取与业务名称匹配的一条（引用 type="document"）；单据中找不到时从字段「订购短信」对应的短信中摘取客户承诺（引用 type="api"）。逐字引用。
- name: 是否录音
  type: enum
  values:
  - '|录音'
  - '|其他'
  evidence: derive
  whenMissing: value
  defaultValue: '|其他'
  description: 当字段「受理渠道」为 found 时：其值为“热线”填“|录音”，否则填“|其他”（引用 {"type":"field","name":"受理渠道"}）；当「受理渠道」为 not_found 时提交 not_found（由模板默认值自动输出“|其他”）。
- name: 受理渠道
  visible: false
  type: enum
  values:
  - 热线
  - 掌上营业厅
  - 其他
  evidence: derive
  whenMissing: value
  defaultValue: 其他
  description: 按 Skill accept-type 从字段「订购短信」判断：当「订购短信」为 found 时，短信正文包含“热线渠道”为“热线”，包含“线上渠道”为“掌上营业厅”，都不包含为“其他”（引用 {"type":"field","name":"订购短信"} 及对应短信记录）；当「订购短信」为 not_found 时提交 not_found （由模板默认值自动输出“其他”，不得引用 not_found 的前置字段）。该字段只以 Skill 判定结果为准，不得改填“营业厅”。
- name: 二次确认短信
  evidence: quote
  quoteWhole: true
  description: 按 Skill second-confirmation-sms 查询本次业务的二次确认短信正文，整条原样引用。
- name: 业务名称
  evidence: input
  description: 等于入参「业务名称」。
- name: 验证码短信
  evidence: quote
  quoteWhole: true
  description: 按 Skill verification-sms 查询本次业务的验证码短信正文，整条原样引用。
- name: 订购短信
  evidence: quote
  quoteWhole: true
  description: 按 Skill business-sms 查询，取命中本次业务名称的最新一条订购短信正文，整条原样引用，不得删改任何字符。
