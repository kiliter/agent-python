119: "客户对某账期或多账期的话费账单总额、套餐月租、活动到期资费恢复及套餐外流量/语音/短彩信超额扣费提出综合异议。核查账期内活动到期资费变更提醒、语音超额提醒与流量超额提醒记录。"  # 套餐费用争议类
120: "客户对家庭宽带/融合宽带包年或合约活动到期后的自动续约、到期前提醒短信、已续约次数及光猫/机顶盒等宽带设备押金退还情况产生争议。"  # 宽带业务续约争议类
121: "客户对宽带开户办理、宽带套餐资费、宽带捆绑营销活动费用或安装地址记录产生争议，支持从单据或附加信息中提取宽带安装地址与客户手机号。"  # 宽带业务费用争议类
122: "客户申请携号转网（携出）时因名下存在未到期的合约、优惠活动或业务协议受阻，或客户发送携转查询短信后对我公司回复的限制条件有异议。会提取携转资格查询日期与回复短信正文。"  # 携号转网协议冲突类
123: "客户对已办理的各类促销/优惠营销活动提出一般性办理核查诉求，需核实活动时间、活动内容、违约责任（客户承诺）以及确认与办理成功告知短信。"  # 活动办理争议类
124: "客户质疑套餐内流量消耗异常过快，或投诉当月流量达到阈值（如高速流量用尽降至 1Mbps、超 200GB 降至 128Kbps）后被触发达量降速/限速机制。"  # 流量使用争议类
125: "客户投诉超出套餐内国内流量或定向流量后产生套餐外上网流量扣费，需核查月度国内流量、定向流量额度、超出后计费标准及超额提醒机制。"  # 流量扣费争议处理模板
126: "客户投诉办理业务或营销活动后，实际执行的资费、内容或限制条件与当时掌厅宣传页面、10086 热线外呼/呼入电话录音或营业厅受理单宣传不一致。"  # 营销宣传不符类
127: "客户反映参与营销活动时约定的返还话费、赠送流量/电子券/权益礼品或月租减免承诺未按期兑现到账，需核实原活动协议约定的活动内容与客户承诺条款。"  # 营销承诺不兑现类
128: "客户对名下营销活动产生常规争议（无到期涨价、宣传录音比对、赠费未兑现、误导话术等细分特征时的营销活动标准核查模板，含网厅掌厅公示说明）。"  # 营销活动争议类
129: "客户参与的营销活动期满后，因未申请取消或变更，按约恢复套餐原价或自动关闭从而引发账单费用变化争议。支持查询营销案到期前提醒短信。"  # 营销活动到期费用争议处理类
