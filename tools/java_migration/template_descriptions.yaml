# #Created By AiCoding(codex) 模板说明（template.yaml 的 description）：描述模板适用场景与核查内容，由 generate.py 写入。

100: "客户反映对名下已开通的普通业务/套餐或营销活动完全不知情，否认曾主动办理。模板按争议类型区分“业务”（标准资费+套餐内容）与“营销活动”（活动时间+活动内容+违约责任），并举证二次确认短信、验证码短信及办理成功告知短信。"  # 不知情业务办理争议处理类
101: "客户对已办理的普通业务、套餐或营销活动产生一般性办理争议（无不知情、未授权、未告知、误导等特定定性标签时的通用业务办理核查模板）。"  # 业务办理争议类
102: "客户或监管工单质疑业务/营销活动办理流程的合规性、鉴权有效性以及产品资费是否公开透明公示。在完整核查办理协议、录音、确认短信与告知短信外，额外声明产品已通过网厅和掌厅公示。"  # 业务办理合规类
103: "客户认可办理过普通业务或套餐，但投诉办理时工作人员或页面未明确告知标准资费或具体业务内容。"  # 业务办理告知争议类
104: "客户投诉业务、套餐或营销活动未经本人授权同意即被开通（如质疑营业厅/热线擅自操作、他人冒办代办、未通过本人身份鉴权或二次确认）。"  # 业务办理未授权争议处理类
105: "客户办理的阶段性折扣/减免优惠活动期满后，因未申请取消或未办理变更，套餐按协议恢复原价引发的涨价争议。支持查询活动到期前下发的到期提醒短信。"  # 优惠活动到期资费恢复争议处理模板
106: "客户对手机话费充值记录、未到账、延迟到账、充值金额或充值渠道产生疑问，需调取充值记录逐笔核实充值时间、支付方式、充值金额与订单流水号。"  # 充值争议处理通用模板
107: "客户在充值缴费时输错手机号码，将话费误充入他人号码并引发退费或核查诉求，需查询被充错目标号码在指定账期/日期内的真实充值流水。"  # 充值错号处理类
108: "客户办理的合约类活动已到期，对到期前是否收到提醒、到期后套餐恢复原价或自动关闭的处理结果有异议，需核查到期提醒短信与日期。"  # 合约到期处理类
109: "客户对所签署合约协议本身的条款内容（活动期限、优惠规则、客户承诺/违约责任条款等）存在异议或要求核实协议详情，暂不涉及提前解约赔付违约金计算或到期提醒。"  # 合约协议争议类
110: "客户对名下未到期合约约束以及提前终止合约需按协议支付违约金的规定一并提出异议，属于合约绑定+违约金争议的综合处理模板。"  # 合约及违约金争议处理类
111: "客户在合约套餐协议期未满时申请解约以办理套餐变更，系统根据单据是否存在违约责任条款说明“如需办理套餐变更，需按协议违约条款支付违约金中断活动后办理”。"  # 合约套餐提前解约处理类
112: "客户投诉合约或优惠活动到期后被“自动续约/自动顺延”，或对到期延续/到期结束短信告知有争议。核查到期前后 31 天内的【续约确认提醒】/【到期提醒】及【续约成功提醒】短信。"  # 合约延续争议类
113: "客户在合约期内明确要求退订、取消正在履行的合约活动或捆绑业务，因被告知未到期取消需赔付违约金而产生投诉。"  # 合约期内业务取消违约金争议类
114: "客户在合约营销活动尚未到期时要求提前解约中断活动，模板核查办理详情与公示情况，并在单据包含违约责任条款时输出提前中断需支付违约金说明。"  # 合约活动提前解约类
115: "客户办理购机补贴、终端捆绑或机卡匹配类合约活动后，在活动期内发生机卡分离、停机、拆机等违约行为，导致无法继续享受优惠或产生违约追偿争议。"  # 合约活动违约争议处理模板
116: "客户对视频彩铃、咪咕视频/音乐会员、云盘、来电显示、手机报、权益包等增值业务（含热线、合作方平台、电视端、APP、短信渠道办理）的订购与月功能费扣费产生争议。"  # 增值业务扣费争议处理模板
117: "客户申请将高档位套餐降档为低档位套餐或变更为其他主套餐时，因名下存在未到期的合约或营销活动而无法直接办理，需先支付违约金中断活动。"  # 套餐变更与降档争议处理类
