131: "客户申请办理手机号码过户（变更机主）时受阻。模板会自动识别号码是否为靓号：属靓号则核查靓号等级、《靓号使用协议》未到期损失赔偿金或受让人重签靓号协议要求；非靓号则核查在途活动未到期支付违约金要求。"  # 过户业务受阻类
